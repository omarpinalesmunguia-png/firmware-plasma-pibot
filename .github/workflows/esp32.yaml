name: 'Build grblHAL PiBot Plasma (ESP32-S3)'

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with ESP-IDF v4.4
      uses: docker://espressif/idf:release-v4.4
      with:
        entrypoint: /opt/esp/entrypoint.sh
        args: >-
          bash -c "
          idf.py set-target esp32s3 &&
          idf.py build &&
          cd build &&
          esptool.py --chip esp32s3 merge_bin -o grbl_pibot_plasma_merged_0x0.bin @flash_args
          "

    - name: Upload Firmware Binary
      uses: actions/upload-artifact@v4
      with:
        name: grbl_pibot_plasma_firmware
        path: |
          build/grbl_pibot_plasma_merged_0x0.bin
          build/grbl.bin
